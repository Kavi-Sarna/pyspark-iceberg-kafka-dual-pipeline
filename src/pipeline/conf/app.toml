# Defaults, shipped inside the package so the image carries them.
#
# Override a whole file with PIPELINE_CONFIG or --config, or any single value
# with the environment variable named beside it. Credentials are deliberately
# absent: this file is committed, so it holds shape and never secrets.

[catalog]
# warehouse is deliberately absent. It is the switch: no warehouse means no
# catalog, so a bare run touches no network. Set ICEBERG_WAREHOUSE, or put it
# in an override file.
name = "lake"                            # ICEBERG_CATALOG
type = "rest"                            # ICEBERG_CATALOG_TYPE
uri = "http://iceberg-rest:8181"         # ICEBERG_URI
s3_endpoint = "http://minio:9000"        # S3_ENDPOINT
region = "us-east-1"                     # AWS_REGION
# access_key / secret_key come only from AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY.

[kafka]
# bootstrap_servers is absent for the same reason: it is the switch.
schema_registry = "http://schema-registry:8081"    # SCHEMA_REGISTRY_URL

[tables]
namespace = "ops"
shipments = "shipments"
deliveries = "deliveries"
output = "shipment_deliveries"

[stream]
# How late an event may arrive and still join. Also how long state is kept, so
# it is a memory setting as much as a correctness one.
lateness = "10 minutes"
# The time-range bound. A stream-stream left outer join will not plan without
# one; batch leaves it unset.
max_lag = "30 minutes"
trigger = "10 seconds"
checkpoint = "/var/lib/pipeline/checkpoints/stream"

[events]
# Event logs feed the History Server. A streaming query runs for weeks, so the
# question is not whether the log rolls but whether anything deletes the parts.
# Off by default. Spark refuses to start if the directory does not exist, so
# a packaged default of true would make a bare run depend on a path nobody
# created. The Compose stack sets EVENT_LOG_ENABLED=true, where the volume is.
enabled = false                          # EVENT_LOG_ENABLED
dir = "/tmp/spark-events"                # EVENT_LOG_DIR
# Rolling splits one growing file into many. Spark 4 does this by default;
# setting it is documentation, not a change.
rolling = true
max_file_size = "128m"
compression = "zstd"
# The one that actually bounds disk. Spark's default is Int.MaxValue, so every
# part file is kept forever and rolling on its own changes nothing.
retain_files = 20
# Compaction rewrites older parts, dropping events no UI page needs. Below
# this score a rewrite is not worth the IO.
compaction_threshold = 0.7
