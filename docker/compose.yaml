name: pipeline

# Every service runs the image this repo builds, not a stock Spark image. That
# is the point of the exercise: the cluster executes your code and your Python,
# so a dependency missing from the image fails here rather than in production.
x-image: &image
  image: pipeline:local
  build:
    context: ..
    dockerfile: docker/Dockerfile

services:
  # spark-class runs in the foregroun, which is what a container wants. The 
  # sbin/start-*.sh scripts daemonize and the container would exit immediately.
  spark-master:
    <<: *image
    container_name: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"     # master UI
      - "7077:7077"     # submit
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
  
  spark-worker:
    <<: *image
    container_name: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: "1g"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"     # worker UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
  
  # Reads the event logs the driver writes. Without it a finished application
  # disappears from the master UI and you have no way to inspect what it did.
  spark-history:
    <<: *image
    container_name: spark-history
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=/tmp/spark-events
    volumes:
      - spark-events:/tmp/spark-events
    ports:
      - "18080:18080"     # history UI
    
  # Started explicitly by `make submit`, never by `compose up`.
  submit:
    <<: *image
    container_name: submit
    profiles: ["submit"]
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    volumes:
      - spark-events:/tmp/spark-events
    environment:
      ICEBERG_WAREHOUSE: s3://warehouse/
      ICEBERG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: pipeline-local
      AWS_SECRET_ACCESS_KEY: pipeline-local-secret
      AWS_REGION: us-east-1
    # spark.driver.host: executors dial the driver back, so it must advertise an 
    # address they can reach. `compose run` does not alias the service name, so
    # use the container's own IP on the project network.
    # 
    # The entry file is asked of the installed package rather than hardcoded:
    # --no-editable puts it under site-packages at a python-version-dependent
    # path, and spark-submit takes a file, not a module.
    command:
      - /bin/bash
      - -c
      - >-
        exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --name pipeline-smoke
        --packages org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0
        --conf spark.driver.host="$$(hostname -i)"
        --conf spark.eventLog.enabled=true
        --conf spark.eventLog.dir=/tmp/spark-events
        --conf spark.sql.shuffle.partitions=1
        "$$(/app/.venv/bin/python -c 'import pipeline.main as m; print(m.__file__)')"


  # ----------------------- object storage and catalog -----------------------
  # Upstream minio/minio was deleted from Docker Hub on 2026-09-11 and the OSS 
  # repo is archived. pgsty/minio is Silo, Pigsty's AGPL fork, which kepps the 
  # MINIO_* variables and the S3 routes. Pinned by digest: a community fork is 
  # a supply-chain dependency and should not be able to move under us.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pipeline-local
      MINIO_ROOT_PASSWORD: pipeline-local-secret
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Console UI
    volumes:
      - minio-data:/data


  # Creates the bucket and exits. Its retry loop is also how everything else 
  # waits for MinIO, which avoids a healthcheck that would depend on curl or 
  # wget being present in an image we do not build.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 pipeline-local pipeline-local-secret;
        do echo "waiting for minio"; sleep 1; done &&
        mc mb --ignore-existing local/warehouse &&
        echo "bucket ready"


  iceberg-rest:
    # image: apache/iceberg-rest-fixture:1.10.1@sha256:f7d679d30ac9c640bdeb2c015dff533cd3c8f1c7d491ebcb5d436f9a42db1d6f
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # CATALOG_* maps onto catalog propoerties: single _ becomes a dot, double 
      # __ becomes a dash. So CATALOG_IO__IMPL is the io-impl property.
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # Pass both Iceberg S3FileIO properties and AWS SDK v2 system properties
      # JAVA_TOOL_OPTIONS: >-
      #   -Dwarehouse=s3://warehouse/
      #   -Dio-impl=org.apache.iceberg.aws.s3.S3FileIO
      #   -Ds3.endpoint=http://minio:9000
      #   -Ds3.path-style-access=true
      #   -Ds3.access-key-id=pipeline-local
      #   -Ds3.secret-access-key=pipeline-local-secret
      #   -Daws.region=us-east-1
      #   -Daws.s3.pathStyleAccess=true
      #   -Daws.s3.useArnRegion=false
      # AWS environment variables
      AWS_ACCESS_KEY_ID: pipeline-local
      AWS_SECRET_ACCESS_KEY: pipeline-local-secret
      AWS_REGION: us-east-1
      # AWS_DEFAULT_REGION: us-east-1
      # AWS_ENDPOINT_URL: http://minio:9000
      # AWS_ENDPOINT_URL_S3: http://minio:9000
      # AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8181 && exec 3<&- && exec 3>&-"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s


  # --- the stream ---------------------------------------------------------
  # KRaft: no ZooKeeper. One node is both broker and controller, which is only
  # sane on a laptop.
  #
  # Two listeners matter. Containers reach the broker as kafka:9092; the host
  # reaches it as localhost:29092. A broker advertises the address clients
  # should dial back on, so a single listener would work from exactly one of
  # those two places and fail confusingly from the other.
  kafka:
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      # One broker cannot replicate anything, so every internal topic must ask
      # for one copy. The defaults ask for three and the broker refuses.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s


  # 8085 on the host because 8081 is already the Spark worker UI. Inside the
  # network it is still 8081, which is what every Confluent example assumes.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.10@sha256:ae63c314e3f78f78d5bdce8c64c0f98ea1dc4d358ef52de2fdae56cda7e82ec0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "8085:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  

  # Creates the namespace and tables. Run once, then again whenever a schema 
  # changes; CREATE TABLE IF NOT EXISTS makes it safe to repeat.
  bootstrap:
    <<: *image
    profiles: ["bootstrap"]
    depends_on:
      iceberg-rest:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      ICEBERG_WAREHOUSE: s3://warehouse/
      ICEBERG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: pipeline-local
      AWS_SECRET_ACCESS_KEY: pipeline-local-secret
      AWS_REGION: us-east-1
      IVY_HOME: /tmp/.ivy2
      SPARK_SUBMIT_OPTS: "-Divy.home=/tmp/.ivy2"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    command: ["/app/.venv/bin/python", "-m", "pipeline.bootstrap"]


  # Puts the worked example into the input tables. Separate from bootstrap so 
  # that creating tables and filling them stay distinct operations.
  seed:
    <<: *image
    profiles: ["seed"]
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      ICEBERG_WAREHOUSE: s3://warehouse/
      ICEBERG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: pipeline-local
      AWS_SECRET_ACCESS_KEY: pipeline-local-secret
      AWS_REGION: us-east-1
    command: ["/app/.venv/bin/python", "-m", "pipeline.seed"]


  # The batch job, submitted to the cluster.
  # 
  # --packages on the submit command, not in the session builder: under 
  # spark-submit the JVM is already running by the time Python executes, so a 
  # builder-set spark.jars.packages is silently ignored. The coordinates are 
  # asked of the code so there is only one copy of them.
  batch:
    <<: *image
    profiles: ["batch"]
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    volumes:
      - spark-events:/tmp/spark-events
    environment:
      ICEBERG_WAREHOUSE: s3://warehouse/
      ICEBERG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: pipeline-local
      AWS_SECRET_ACCESS_KEY: pipeline-local-secret
      AWS_REGION: us-east-1
    command:
      - /bin/bash
      - -c
      - >-
        exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --name pipeline-batch
        --packages "$$(/app/.venv/bin/python -c 'from pipeline.session import PACKAGES; print(PACKAGES)')"
        --conf spark.driver.host="$$(hostname -i)"
        --conf spark.eventLog.enabled=true
        --conf spark.eventLog.dir=/tmp/spark-events
        --conf spark.sql.shuffle.partitions=1
        "$$(/app/.venv/bin/python -c 'import pipeline.main as m; print(m.__file__)')"
        --mode batch

volumes:
  minio-data:
  spark-events:
