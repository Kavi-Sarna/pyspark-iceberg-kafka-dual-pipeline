# The query triggers every 10 seconds, so scraping faster than that only
# resamples the same value. Scraping slower would miss triggers entirely.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pipeline
    static_configs:
      - targets: ["statsd:9102"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
